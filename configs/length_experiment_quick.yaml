experiment_name: length_experiment_quick
backend: colab
seed: 42
notes: "Quick length experiment. 1 backbone per length. Run AFTER 100aa reproduction succeeds."
rso:
  lengths: [100, 150, 200]
  copies: 1
  iterations: 100
  stage1_iterations: 90
  stage2_iterations: 10
  protocol: hallucination
  mode: ["gumbel", "soft"]
  rm_aa: "C"
  loss:
    rg_weight: 0.1
    rg_weight_large_over_600: 0.01
    helix_weight: -0.2
    con_weight: 1.0
    plddt_weight: 0.5
    pae_weight: 0.5
mpnn:
  num_seqs: 8
  temperature: 0.1
  weights: soluble
  rm_aa: "C"
validation:
  model: alphafold_single
  alphafold_model: model_4_ptm
  num_recycles: 3
  use_initial_guess: false
  use_aa_initialization: false
output:
  base_dir: results/runs
  overwrite: false
  resume: true
experiment:
  backbones_per_length: 1
  seeds_override: null
